name: Security

# Supply-chain and code scanning, beside CI rather than inside it: CI answers
# "does it work", this answers "is it safe to depend on", and the second
# question has to be asked again every week even when nothing here changed,
# because the vulnerability databases did.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Fails only on vulnerabilities in code this module actually calls.
      - name: Reachable vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  gitleaks:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The binary rather than gitleaks-action, which needs a paid licence for
      # organisation repositories. Whole history: a secret removed in a later
      # commit is still published.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 \
            git /repo --redact --no-banner --exit-code 1

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: github/codeql-action/init@v4
        with:
          languages: go
          queries: security-extended

      - uses: github/codeql-action/autobuild@v4

      - uses: github/codeql-action/analyze@v4

  scorecard:
    name: OpenSSF Scorecard
    # Scorecard publishes to the public API, and only for public repositories.
    if: github.event_name != 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@v2
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scorecard.sarif
